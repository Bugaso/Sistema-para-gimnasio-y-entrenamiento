spring.application.name=Gimnasio-Atlas

server.port=8080

# Configuración de correo (SMTP - Gmail por defecto)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:tu_correo@gmail.com}
spring.mail.password=${MAIL_PASS:tu_clave_de_aplicacion}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gym_atlas}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:tu_password_mysql}

# URL pública de tu aplicación para incluir el enlace en el correo
app.frontend.url=${APP_URL:http://localhost:8080/login}

#Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Dialecto de mysql
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#Si se coloca update se actualiza el esquema de base de datos (create, alter o delete)
#Si se coloca validate solo verifica que las entidades concuerden con las tablas y columnas

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

