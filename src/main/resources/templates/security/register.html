<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gimnasio Atlas - Tester API</title>
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>
<div class="container">
    <form id="formRegistro" class="registro-container">
        <h2>Registro de Usuario</h2>

        <!-- Nombre y Apellido -->
        <div class="form-group">
            <label for="nomApe">Nombre y Apellido</label>
            <input type="text" id="nomApe" name="nomApe" placeholder="Ej: Juan Pérez" required>
        </div>

        <!-- Fecha de Nacimiento -->
        <div class="form-group">
            <label for="fechaNacimiento">Fecha de Nacimiento</label>
            <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
        </div>

        <!-- DNI -->
        <div class="form-group">
            <label for="dniUs">DNI / Documento</label>
            <input type="number" id="dniUs" name="dniUs" placeholder="Ej: 40123456" required>
        </div>

        <!-- Teléfono -->
        <div class="form-group">
            <label for="telUs">Teléfono</label>
            <input type="tel" id="telUs" name="telUs" placeholder="Ej: 1123456789" required>
        </div>

        <!-- Correo Electrónico -->
        <div class="form-group">
            <label for="mailUs">Correo Electrónico</label>
            <input type="email" id="mailUs" name="mailUs" placeholder="usuario@ejemplo.com" required>
        </div>

        <!-- Categoría de Usuario -->
        <div class="form-group">
            <label for="idCatUs">Categoría de Usuario</label>
            <select id="idCatUs" name="idCatUs" required>
                <!-- Esta opción cambia automáticamente cuando JS trae los datos -->
                <option value="" disabled selected>Cargando categorías...</option>
            </select>
        </div>

        <!-- Contraseña -->
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <!-- Botón de Envío -->
        <button type="submit" class="btn-submit">Registrarse</button>
    </form>
</div>

<script src="/js/register.js"></script>
</body>
</html>
