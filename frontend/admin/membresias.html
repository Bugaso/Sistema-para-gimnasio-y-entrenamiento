<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Membresías — Atlas Gym</title>
    <link rel="stylesheet" href="../src/css/admin/admin.css" />
    <link rel="stylesheet" href="../src/css/index/index.css" />
<!--    <script type="module" src="../src/javascript/layout-admin.js"></script>-->
</head>
<body class="admin-page">

<div class="admin-shell" data-admin-shell>
    <aside data-layout-sidebar></aside>

    <div class="admin-workspace">
        <header data-layout-topbar></header>
        <div class="admin-content">

    <div class="admin-heading admin-heading-compact">
        <div>
            <p class="eyebrow">Gestión de Planes</p>
            <h1>Membresías</h1>
            <p>Registra membresías base y configura sus diferentes tipos, duraciones y costos.</p>
        </div>
    </div>

    <!-- FORMULARIO DE ALTA -->
    <div class="admin-panel" style="margin-bottom: 40px;">
        <div class="admin-panel-heading">
            <div>
                <span id="form-kicker">Nuevo Registro</span>
                <h2 id="form-title">Alta de Membresía</h2>
            </div>
        </div>

        <form id="formMembresia" style="padding: 24px;">
            <input type="hidden" id="membresiaId" name="membresiaId" />

            <!-- PASO 1: Datos de Membresía Base -->
            <div class="admin-form-grid" id="pasoMembresia">
                <label class="admin-field admin-field-wide">
                    <span>Nombre / Descripción de la Membresía (Ej. Musculación)</span>
                    <input type="text" id="descMembresia" required />
                </label>
            </div>

            <!-- PASO 2: Agregar Tipos (Oculto inicialmente hasta confirmar la membresia) -->
            <div id="pasoTipos" style="display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border);">
                <h3 style="margin-bottom: 15px;">Añadir Tipo a <span id="nombreMembresiaSeleccionada" style="color:var(--lime);"></span></h3>
                <input type="hidden" id="tipoId" />

                <div class="admin-form-grid">
                    <label class="admin-field">
                        <span>Días de Asistencia</span>
                        <input type="number" id="diasAsistencia" placeholder="Ej. 3" min="1" required />
                    </label>
                    <label class="admin-field">
                        <span>Duración (Días)</span>
                        <input type="number" id="duracion" placeholder="Ej. 30 (1 mes)" min="1" required />
                    </label>
                    <label class="admin-field">
                        <span>Costo ($)</span>
                        <input type="number" id="costo" placeholder="Ej. 5000" min="0" required />
                    </label>
                    <label class="admin-field" style="display: flex; align-items: center; gap: 10px; margin-top: 25px;">
                        <input type="checkbox" id="planificacion" style="width: auto;" />
                        <span>Incluye Planificación</span>
                    </label>
                </div>
            </div>

            <p class="admin-form-status" id="formStatus" role="status"></p>

            <div class="admin-dialog-actions" style="margin-top: 20px;">
                <button type="button" id="btnSiguiente" class="admin-primary-action">Continuar a Tipos</button>
                <button type="button" id="btnGuardarTipo" class="admin-primary-action" style="display: none;">Guardar Tipo de Membresía</button>
                <button type="button" id="btnFinalizar" style="display: none;" onclick="window.resetFormularioMembresia()">Finalizar Registro</button>
            </div>
        </form>
    </div>

    <!-- TABLA DE MEMBRESÍAS -->
    <div class="admin-panel">
        <div class="admin-panel-heading">
            <div>
                <span>Planes Disponibles</span>
                <h2>Lista de Membresías</h2>
            </div>
        </div>

        <!-- AQUÍ AGREGAS EL CHECKBOX -->
        <div class="admin-toolbar" style="padding: 16px 24px; border-bottom: 1px solid var(--border);">
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                <input type="checkbox" id="chkInactivos" onchange="renderizarTablaMembresias()" style="width: auto;" />
                <span style="font-size: 0.875rem; color: var(--muted);">Mostrar membresías inactivas</span>
            </label>
        </div>

        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>Membresía</th>
                    <th>Tipos Registrados</th>
                    <th>Estado</th>
                    <th style="text-align: right;">Acciones</th>
                </tr>
                </thead>
                <tbody id="tablaMembresias"></tbody>
            </table>
        </div>
    </div>
        </div>
    </div>
</div>
<!-- Modal Detalles y Tipos -->
<dialog class="admin-dialog" id="modalDetalles">
    <div class="admin-dialog-heading" style="padding: 24px; border-bottom: 1px solid var(--border);">
        <h2 id="modalTitle">Detalles</h2>
        <button type="button" onclick="document.getElementById('modalDetalles').close()">X</button>
    </div>
    <div style="padding: 24px;">
        <table class="admin-table">
            <thead>
            <tr><th>Días</th><th>Duración</th><th>Planificación</th><th>Costo</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tablaTiposDetalle"></tbody>
        </table>
    </div>
</dialog>

<script type="module" src="../src/javascript/admin/membresias.js"></script>
</body>
</html>
