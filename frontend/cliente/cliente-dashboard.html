<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Panel — Atlas Gym</title>
    <link rel="stylesheet" href="../src/css/admin/admin.css" />
    <link rel="stylesheet" href="../src/css/index/index.css" />
    <style>
        .client-header { background: #ffffff; border-bottom: 1px solid #d1d5d2; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; }
        .client-header h1 { font-family: 'Oswald', sans-serif; text-transform: uppercase; margin: 0; color: #333; font-size: 1.8rem; }

        .client-tabs { display: flex; gap: 20px; padding: 0 24px; background: #ffffff; border-bottom: 1px solid #d1d5d2; }
        .tab-btn { background: transparent; border: none; padding: 16px 8px; font-size: 1rem; font-weight: bold; color: #888d89; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.3s; }
        .tab-btn.active { color: var(--lime); border-bottom-color: var(--lime); }
        .tab-btn:hover:not(.active) { color: #333; }

        .client-container { padding: 32px 24px; max-width: 960px; margin: 0 auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .client-input { width: 100%; padding: 12px; border: 1px solid #d1d5d2; border-radius: 6px; background-color: #f7f9f9; color: #333; font-size: 1rem; margin-top: 6px; }
        .client-input:focus { border-color: var(--lime); outline: none; background-color: #ffffff; box-shadow: 0 0 0 3px rgb(217 4 41 / 10%); }

        .card { background: #ffffff; border: 1px solid #d1d5d2; border-radius: 8px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eaeaea; padding-bottom: 16px; margin-bottom: 16px; }
        .card-header h2 { margin: 0; font-family: 'Oswald', sans-serif; text-transform: uppercase; color: #333; }

        /* Actualizado para manejar 2 selectores */
        .date-picker-wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #f7f9f9; padding: 16px; border-radius: 8px; border: 1px solid #d1d5d2; margin-bottom: 24px; flex-wrap: wrap; }
        .date-picker-wrap input[type="date"], .date-picker-wrap select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-weight: bold; color: #333; background: #fff; cursor: pointer; }

        .badge-planificado { background: #f3f4f6; color: #4b5563; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; border: 1px solid #d1d5db; }
        .badge-completado { background: #dcfce7; color: #166534; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; border: 1px solid #bbf7d0; }

        .table-input { width: 100%; padding: 8px 12px; border: 1px solid #d1d5d2; border-radius: 4px; background-color: #ffffff; color: #333; }
        .table-input:focus { border-color: var(--lime); outline: none; box-shadow: 0 0 0 3px rgb(217 4 41 / 10%); }

        .ejercicio-card { background: #ffffff; border: 1px solid #d1d5d2; border-radius: 8px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .ejercicio-titulo { color: var(--lime); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;}
        .ejercicio-titulo h3 { margin: 0; font-family: 'Oswald', sans-serif; font-size: 1.6rem; text-transform: uppercase; color: #333; }

        .info-planificada { font-size: 0.9rem; color: #666; margin-bottom: 20px; background: #f7f9f9; padding: 12px 16px; border-radius: 4px; border: 1px solid #eaeaea; }

        button.is-danger.remove-serie { background: transparent; border: 1px solid #d1d5d2; color: #888; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        button.is-danger.remove-serie:hover { border-color: #ef7e64; color: #ef7e64; background: rgb(239 126 100 / 10%); }

        .btn-ver-video { background: transparent; border: 1px solid #6b7270; color: #6b7270; padding: 6px 14px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.2s; margin-left: auto; margin-right: 12px; }
        .btn-ver-video:hover { background: #6b7270; color: white; }

        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; border-radius: 8px; margin-top: 15px; display: none; }
        .video-container.active { display: block; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>
<body style="background-color: #f0f2f2; margin: 0; font-family: 'Inter', sans-serif;">

<!-- HEADER CLIENTE -->
<header class="client-header">
    <h1><a href="/">Atlas Gym <span style="color: var(--lime);" >| Cliente</span></a></h1>
    <button id="btnCerrarSesion" style="background: transparent; border: 1px solid #d1d5d2; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; color: #555;">Cerrar Sesión</button>
</header>

<!-- PESTAÑAS (TABS) -->
<nav class="client-tabs">
    <button class="tab-btn active" data-target="perfil">Mi Perfil</button>
    <button class="tab-btn" data-target="rutina" id="tabRutina" style="display: none;">Mi Entrenamiento</button>
</nav>

<!-- CONTENEDOR PRINCIPAL -->
<main class="client-container">

    <!-- VISTA 1: PERFIL -->
    <section id="perfil" class="tab-content active">
        <div class="card">
            <div class="card-header">
                <h2>Datos Personales</h2>
            </div>
            <form id="formPerfilCliente">
                <div class="admin-form-grid">
                    <label class="admin-field admin-field-wide">
                        <span style="font-weight: bold; color: #555;">Nombre y Apellido</span>
                        <input type="text" id="nomApe" class="client-input" required />
                    </label>
                    <label class="admin-field">
                        <span style="font-weight: bold; color: #555;">DNI</span>
                        <input type="text" id="dniUs" class="client-input" readonly style="background: #e5e7eb; cursor: not-allowed;" />
                    </label>
                    <label class="admin-field">
                        <span style="font-weight: bold; color: #555;">Fecha de Nacimiento</span>
                        <input type="date" id="fechaNacimiento" class="client-input" required />
                    </label>
                    <label class="admin-field">
                        <span style="font-weight: bold; color: #555;">Teléfono</span>
                        <input type="text" id="telUs" class="client-input" required />
                    </label>
                    <label class="admin-field">
                        <span style="font-weight: bold; color: #555;">Email</span>
                        <input type="email" id="mailUs" class="client-input" required />
                    </label>
                    <label class="admin-field admin-field-wide">
                        <span style="font-weight: bold; color: #555;">Contacto de Emergencia</span>
                        <input type="text" id="contacoE" class="client-input" placeholder="Nombre y teléfono de emergencia..." />
                    </label>
                </div>
                <div style="margin-top: 24px; text-align: right;">
                    <span id="perfilStatus" style="margin-right: 15px; font-weight: bold;"></span>
                    <button type="submit" class="admin-primary-action" style="padding: 12px 24px;">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </section>

    <!-- VISTA 2: RUTINA Y CALENDARIO -->
    <section id="rutina" class="tab-content">

        <div class="date-picker-wrap">
            <div>
                <h3 style="margin: 0 0 5px 0; color: #333; font-family: 'Oswald', sans-serif; text-transform: uppercase;">Mi Calendario</h3>
                <p style="margin: 0; color: #666; font-size: 0.9rem;">Elige una fecha y el día de rutina a registrar.</p>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <div>
                    <label style="display: block; font-size: 0.75rem; color: #666; font-weight: bold; margin-bottom: 2px;">Fecha de Registro</label>
                    <input type="date" id="fechaCalendario" />
                </div>
                <div>
                    <label style="display: block; font-size: 0.75rem; color: #666; font-weight: bold; margin-bottom: 2px;">Día Planificado</label>
                    <select id="selectDiaSemanaManual">
                        <option value="Domingo">Domingo</option>
                        <option value="Lunes">Lunes</option>
                        <option value="Martes">Martes</option>
                        <option value="Miércoles">Miércoles</option>
                        <option value="Jueves">Jueves</option>
                        <option value="Viernes">Viernes</option>
                        <option value="Sábado">Sábado</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="card" style="padding-bottom: 5px;">
            <div class="card-header" style="border: none; padding-bottom: 5px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                <select id="selectorRutinaDia" class="client-input" style="width: auto; font-family: 'Oswald', sans-serif; font-size: 1.4rem; margin: 0; padding: 4px 35px 4px 10px; font-weight: bold; text-transform: uppercase; color: #333; height: auto; line-height: 1.2; border-color: var(--lime); cursor: pointer;">
                    <option value="">Ejercicios del Día</option>
                </select>
                <span id="estadoSesionBadge" class="badge-planificado">Planificado</span>
            </div>
            <div style="padding: 0 24px 15px;">
                <span id="infoRutinaSeleccionada" style="font-size: 0.85rem; color: #666; font-weight: bold; background: #f3f4f6; padding: 4px 10px; border-radius: 4px; display: none;"></span>
            </div>
        </div>

        <!-- FORMULARIO DE REGISTRO IDENTICO AL DEL COACH -->
        <form id="formSesionCliente">
            <div id="contenedorEjerciciosCliente"></div>
            <div id="botonGuardarSesionContainer" style="display: none; text-align: right; margin-bottom: 30px;">
                <p id="registroStatus" style="color: #ef9d89; font-size: 0.85rem; font-weight: bold; display: inline-block; margin-right: 15px;"></p>
                <button class="admin-primary-action" type="submit" style="padding: 12px 30px; font-size: 1.1rem;">Guardar Sesión Completa</button>
            </div>
        </form>

    </section>

</main>

<div class="admin-toast" id="toast" hidden></div>
<script type="module" src="../src/javascript/cliente/dashboard.js"></script>
</body>
</html>
