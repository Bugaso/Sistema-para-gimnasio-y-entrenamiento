<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control de Asistencia — Recepción</title>
    <link rel="stylesheet" href="../src/css/admin/admin.css" />
    <link rel="stylesheet" href="../src/css/index/index.css" />
    <style>
        .select-cliente { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 4px; background-color: #1a1a1a; color: white; font-size: 1.1rem; }
        .asistencia-box { text-align: center; padding: 40px 20px; background: #121212; border: 1px solid #333; border-radius: 8px; margin-top: 20px; display: none; }
        .foto-cliente { width: 120px; height: 120px; border-radius: 50%; background: #333; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #666; }
        .btn-toggle { width: 100%; max-width: 400px; padding: 16px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-top: 20px; }
        .btn-entrada { background-color: #a3e635; color: #000; }
        .btn-entrada:hover { background-color: #8cc629; }
        .btn-salida { background-color: #ef4444; color: #fff; }
        .btn-salida:hover { background-color: #dc2626; }
    </style>
</head>
<body class="admin-page">

<div class="admin-shell" data-admin-shell>
    <aside data-layout-sidebar></aside>
    <div class="admin-workspace">
        <header data-layout-topbar></header>

        <div class="admin-content">
            <div class="admin-heading admin-heading-compact">
                <div>
                    <p class="eyebrow">Recepción</p>
                    <h1>Control de Asistencia</h1>
                </div>
            </div>

            <!-- BÚSQUEDA INCREMENTAL DE CLIENTE -->
            <div class="admin-panel">
                <label style="display: block; font-weight: bold; margin-bottom: 10px;">Buscar y Seleccionar Cliente</label>

                <!-- Buscador de texto -->
                <input type="text" id="buscadorCliente" class="table-input" placeholder="🔎 Ingrese el DNI o el Nombre del cliente..." style="width: 100%; padding: 14px; font-size: 1.1rem; margin-bottom: 10px; border-radius: 4px; border: 1px solid #333; background: #1a1a1a; color: white;" autocomplete="off" />

                <!-- Lista de resultados (size="6" la mantiene abierta) -->
                <select id="selectCliente" class="select-cliente" size="6" style="padding: 5px; cursor: pointer; overflow-y: auto;">
                    <option value="">Cargando clientes...</option>
                </select>
            </div>

            <!-- Panel de Acción (Se muestra al elegir cliente) -->
            <div id="panelAsistencia" class="asistencia-box">
                <div class="foto-cliente">👤</div>

                <!-- MOSTRANDO EL NOMBRE Y DNI EN LA INFO -->
                <h2 id="nombreClienteDisplay" style="margin-bottom: 5px; color: white;">-</h2>
                <p id="dniClienteDisplay" style="color: #9ca3af; margin-bottom: 20px; font-size: 1.1rem;">-</p>

                <p id="estadoActualTxt" style="font-weight: bold; margin-bottom: 20px; font-size: 1.2rem;"></p>

                <!-- El Botón Único -->
                <button type="button" id="btnAccionToggle" class="btn-toggle"></button>
            </div>
            </div>

        </div>
    </div>
</div>

<div class="admin-toast" id="toast" hidden></div>
<!-- Ajusta la ruta de tu layout si es distinta -->
<script type="module" src="../src/javascript/recepcionista/asistencia.js"></script>
</body>
</html>
