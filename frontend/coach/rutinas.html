<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Rutinas — Coach</title>
    <link rel="stylesheet" href="../src/css/admin/admin.css" />
    <link rel="stylesheet" href="../src/css/index/index.css" />
    <style>
        .table-input { width: 100%; padding: 4px 8px; border: 1px solid #333; border-radius: 4px; background-color: #1a1a1a; color: white; }
        .btn-add { margin-bottom: 16px; display: inline-flex; }
    </style>
</head>
<body class="admin-page">

<div class="admin-shell" data-admin-shell>
    <aside data-layout-sidebar></aside>
    <div class="admin-workspace">
        <header data-layout-topbar></header>

        <div class="admin-content">
            <div class="admin-heading admin-heading-compact">
                <div>
                    <p class="eyebrow">Entrenamiento</p>
                    <h1>Rutinas y Plantillas</h1>
                </div>
            </div>

            <!-- CREAR RUTINA -->
            <div class="admin-panel" style="margin-bottom: 40px;">
                <div class="admin-panel-heading">
                    <div>
                        <span>Constructor</span>
                        <h2>Crear Nueva Rutina</h2>
                    </div>
                </div>

                <form id="formRutina" style="padding: 24px;">
                    <div class="admin-form-grid">
                        <label class="admin-field admin-field-wide">
                            <span>Nombre de la Rutina</span>
                            <input type="text" id="nombreRutina" placeholder="Ej. Hipertrofia Principiantes" required />
                        </label>

                        <label class="admin-field admin-field-wide">
                            <span>Descripción / Notas</span>
                            <textarea id="descripcionRutina" rows="2" placeholder="Indicaciones generales..."></textarea>
                        </label>

                        <label class="admin-field" style="flex-direction: row; align-items: center; gap: 10px;">
                            <input type="checkbox" id="esPlantilla" checked />
                            <span>Guardar como Plantilla General (Para reutilizar)</span>
                        </label>
                    </div>

                    <div style="margin-top: 30px; margin-bottom: 16px;">
                        <h3>Ejercicios de la Rutina</h3>
                    </div>

                    <button type="button" class="admin-primary-action btn-add" id="btnAgregarEjercicio">+ Añadir Ejercicio</button>

                    <div class="admin-table-wrap" style="overflow-x: visible;">
                        <table class="admin-table">
                            <thead>
                            <tr>
                                <th>Día</th>
                                <th>Ejercicio</th>
                                <th>Series</th>
                                <th>Reps</th>
                                <th>Peso</th>
                                <th>Acción</th>
                            </tr>
                            </thead>
                            <tbody id="tablaDetalles"></tbody>
                        </table>
                    </div>

                    <p class="admin-form-status" id="formStatusCreate"></p>
                    <div class="admin-dialog-actions" style="margin-top: 24px;">
                        <button class="admin-primary-action" type="submit">Guardar Rutina Completa</button>
                    </div>
                </form>
            </div>

            <!-- LISTADO DE RUTINAS -->
            <div class="admin-panel" style="margin-bottom: 40px;">
                <div class="admin-panel-heading">
                    <div>
                        <span>Catálogo</span>
                        <h2>Listado de Rutinas</h2>
                    </div>
                </div>
                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Tipo</th>
                            <th>Fecha</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody id="tablaListadoRutinas">
                        <tr><td colspan="5">Cargando rutinas...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- MODAL DE DETALLE DE RUTINA -->
<div id="modalDetalle" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
    <div class="admin-panel" style="width: 750px; max-height: 85vh; overflow-y: auto; background: #121212; padding: 24px; border: 1px solid #333;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 id="modalTituloRutina">Detalle de Rutina</h2>
            <button type="button" id="CerrarModal" class="admin-primary-action" style="padding: 4px 10px;">X</button>
        </div>
        <p id="modalDescRutina" style="color: var(--muted); margin-bottom: 10px;"></p>
        <p id="modalTipoRutina" style="font-weight: bold; margin-bottom: 20px;"></p>

        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
            <label for="selectDiaFiltro" style="font-weight: bold;">Seleccionar Día:</label>
            <select id="selectDiaFiltro" class="table-input" style="max-width: 250px;"></select>
        </div>

        <h3>Ejercicios del Día</h3>
        <div class="admin-table-wrap" style="margin-top: 10px;">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>Ejercicio</th>
                    <th>Series</th>
                    <th>Reps</th>
                    <th>Peso</th>
                    <th>Esfuerzo</th>
                </tr>
                </thead>
                <tbody id="tablaModalDetalles"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="admin-toast" id="toast" hidden></div>
<script type="module" src="../src/javascript/coach/rutinas.js"></script>
</body>
</html>
