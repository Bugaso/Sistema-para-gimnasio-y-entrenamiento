<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asignaciones — Coach</title>
    <link rel="stylesheet" href="../src/css/admin/admin.css" />
    <link rel="stylesheet" href="../src/css/index/index.css" />
</head>
<body class="admin-page">
<div class="admin-shell" data-admin-shell>
    <aside data-layout-sidebar></aside>
    <div class="admin-workspace">
        <header data-layout-topbar></header>
        <div class="admin-content">
            <div class="admin-heading">
                <div>
                    <p class="eyebrow">Operación</p>
                    <h1>Asignaciones de Clientes</h1>
                </div>
            </div>

            <!-- Formulario de Nueva Asignación -->
            <div class="admin-panel">
                <div class="admin-panel-heading">
                    <h2>Vincular Nueva Rutina</h2>
                </div>
                <form id="formAsignacion" style="padding: 24px;">
                    <input type="hidden" id="idAsignacion" />
                    <div class="admin-form-grid">
                        <label class="admin-field">
                            <span>Cliente</span>
                            <select id="idClienteAsignar" required><option value="">Cargando clientes...</option></select>
                        </label>
                        <label class="admin-field">
                            <span>Rutina a Asignar</span>
                            <select id="idRutinaAsignar" required><option value="">Cargando rutinas...</option></select>
                        </label>
                        <label class="admin-field">
                            <span>Duración del Plan</span>
                            <input type="text" id="duracionPlan" placeholder="Ej. 4 Semanas" required />
                        </label>
                    </div>
                    <p class="admin-form-status" id="formStatusAssign"></p>
                    <div class="admin-dialog-actions" style="margin-top: 16px;">
                        <button class="admin-primary-action" type="submit" id="btnGuardarAsignacion">Asignar Cliente</button>
                    </div>
                </form>
            </div>

            <!-- Tabla de Asignaciones Existentes -->
            <div class="admin-panel" style="margin-bottom: 40px;">
                <div class="admin-panel-heading">
                    <h2>Listado de Asignaciones</h2>
                </div>
                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>DNI</th>
                            <th>Rutina / Plan</th>
                            <th>Fecha Inicio</th>
                            <th>Duración</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody id="tablaAsignaciones">
                        <tr><td colspan="6">Cargando asignaciones...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="modalDetalle" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
        <div class="admin-panel" style="width: 750px; max-height: 85vh; overflow-y: auto; background: #121212; padding: 24px; border: 1px solid #333;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 id="modalTituloRutina">Detalle de Rutina Asignada</h2>
                <button type="button" id="CerrarModal" class="admin-primary-action" style="padding: 4px 10px;">X</button>
            </div>
            <p id="modalDescRutina" style="color: var(--muted); margin-bottom: 10px;"></p>
            <p id="modalTipoRutina" style="font-weight: bold; margin-bottom: 20px;"></p>

            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
                <label for="selectDiaFiltro" style="font-weight: bold;">Seleccionar Día:</label>
                <select id="selectDiaFiltro" class="table-input" style="max-width: 250px; padding: 4px 8px; border: 1px solid #333; border-radius: 4px; background-color: #1a1a1a; color: white;"></select>
            </div>

            <h3>Ejercicios del Día</h3>
            <div class="admin-table-wrap" style="margin-top: 10px;">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th>Ejercicio</th>
                        <th>Series</th>
                        <th>Reps</th>
                        <th>Peso</th>
                        <th>Esfuerzo</th>
                    </tr>
                    </thead>
                    <tbody id="tablaModalDetalles"></tbody>
                </table>
            </div>
        </div>
    </div>

</div>
<div class="admin-toast" id="toast" hidden></div>
<script type="module" src="../src/javascript/coach/asignaciones.js"></script>
</body>
</html>
